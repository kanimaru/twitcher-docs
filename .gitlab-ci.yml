stages:
  - build
  - deploy

variables:
  IMAGE_TAG: "$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA"
  CONTAINER_NAME: "twitcher-docs"

build_app:
  stage: build
  image: oven/bun:latest
  script:
    - echo "Installing dependencies with bun..."
    - bun install --frozen-lockfile
    - echo "Building the application..."
    - bun run build
  artifacts:
    paths:
      - .vitepress/dist/
    expire_in: 1 hour

build_and_deploy_local:
  stage: deploy
  image: docker:latest
  needs:
    - build_app
  script:
    - echo "Building Docker image: $IMAGE_TAG"
    - docker build -t "$IMAGE_TAG" .
    - echo "Deploying container '$CONTAINER_NAME' locally..."
    - docker stop "$CONTAINER_NAME" || true
    - docker rm "$CONTAINER_NAME" || true
    - docker run -d --name "$CONTAINER_NAME" -p 8093:80 --restart unless-stopped "$IMAGE_TAG"
    - echo "Container '$CONTAINER_NAME' deployed with image '$IMAGE_TAG' and running on host port 8093."
    # Optional: Clean up old images (use with caution in production)
    # - docker image prune -f --filter "label!=maintainer=GitLab Runner"
